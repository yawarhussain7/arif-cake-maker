
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Email Verification</title>
</head>

<body style="margin:0; padding:0; background-color:#f4f6f8; font-family:Arial,sans-serif;">

  <div style="max-width:500px; margin:30px auto; padding:30px; background:#ffffff; border-radius:12px;">

    <h2 style="color:#2563eb; text-align:center;">
      Verify Your Email
    </h2>

    <p style="color:#374151; font-size:16px;">
      Hello {{name}},
    </p>

    <p style="color:#4b5563; line-height:1.6;">
      Thank you for registering. Please use the verification code below
      to verify your email address.
    </p>

    <div style="margin:25px 0; padding:20px; background:#eff6ff; text-align:center; border-radius:8px;">
      <h1 style="margin:0; color:#2563eb; letter-spacing:8px; font-size:32px;">
        {{otp}}
      </h1>
    </div>

    <p style="color:#4b5563; text-align:center;">
      This code expires in <strong>15 minutes</strong>.
    </p>

    <p style="color:#6b7280; font-size:13px; line-height:1.5;">
      If you did not create this account, you can safely ignore this email.
    </p>

    <hr style="border:none; border-top:1px solid #e5e7eb; margin:25px 0;" />

    <p style="color:#9ca3af; font-size:12px; text-align:center;">
      &copy; 2026 My MERN App. All rights reserved.
    </p>

  </div>

</body>
</html>
